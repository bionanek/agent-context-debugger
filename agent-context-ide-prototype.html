<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Agent Context IDE — Prototype</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --panel-2: #1c2128;
    --border: #30363d;
    --text: #c9d1d9;
    --text-dim: #8b949e;
    --text-bright: #f0f6fc;
    --accent: #58a6ff;
    --green: #3fb950;
    --amber: #d29922;
    --red: #f85149;
    --gray: #6e7681;
    --purple: #bc8cff;
  }

  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    line-height: 1.5;
    overflow: hidden;
  }

  header {
    height: 50px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 30px;
  }
  header h1 {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-bright);
    letter-spacing: 0.5px;
  }
  .badge {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 2px 8px;
    font-size: 11px;
    color: var(--text-dim);
    margin-left: 8px;
    font-weight: 400;
  }
  nav { display: flex; gap: 4px; }
  nav button {
    background: transparent;
    border: none;
    color: var(--text-dim);
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-family: inherit;
  }
  nav button:hover { background: var(--panel-2); color: var(--text); }
  nav button.active { background: var(--panel-2); color: var(--text-bright); }

  main { height: calc(100vh - 50px); display: flex; }
  .view { flex: 1; display: flex; height: 100%; }
  .view[hidden] { display: none; }

  .file-tree {
    width: 240px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 12px;
    overflow-y: auto;
  }
  .file-tree h3 {
    font-size: 11px; text-transform: uppercase; color: var(--text-dim);
    letter-spacing: 0.5px; margin-bottom: 8px;
  }
  .file-item {
    padding: 4px 8px; border-radius: 4px; cursor: pointer;
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--text);
  }
  .file-item:hover { background: var(--panel-2); }
  .file-item .icon { color: var(--text-dim); font-size: 11px; }
  .file-item .stats { margin-left: auto; color: var(--text-dim); font-size: 10px; font-family: monospace; }
  .file-tree .folder {
    font-weight: 600; color: var(--text-dim);
    padding: 8px 8px 2px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px;
  }

  .blocks-pane { flex: 1; overflow-y: auto; padding: 20px; }

  .pane-header { margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
  .pane-header h2 { font-size: 16px; color: var(--text-bright); margin-bottom: 4px; }
  .pane-header .subtitle { font-size: 12px; color: var(--text-dim); }

  .run-bar {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    margin-bottom: 12px;
  }
  .run-bar .label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
  .run-bar .prompt { font-family: 'SF Mono', Menlo, Consolas, monospace; font-size: 12px; color: var(--text-bright); }
  .run-bar .meta { font-size: 11px; color: var(--text-dim); margin-top: 8px; display: flex; gap: 16px; flex-wrap: wrap; }

  .timeline {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    margin-bottom: 16px;
  }
  .timeline-track { display: flex; gap: 6px; margin-top: 8px; align-items: center; flex-wrap: wrap; }
  .step-dot {
    width: 22px; height: 22px; border-radius: 6px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 10px; color: white; font-weight: 600;
    cursor: pointer; transition: transform 0.1s;
  }
  .step-dot:hover { transform: scale(1.15); }
  .step-dot.selected { outline: 2px solid var(--accent); outline-offset: 2px; }
  .step-load { background: var(--gray); }
  .step-reasoning { background: var(--purple); }
  .step-tool { background: var(--accent); }
  .step-overridden { background: var(--amber); }
  .step-conflict { background: var(--red); }

  .block {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: all 0.12s;
    position: relative;
  }
  .block:hover { border-color: var(--accent); }
  .block.selected { border-color: var(--accent); background: var(--panel-2); }
  .block.dimmed { opacity: 0.35; }
  .block.highlighted { box-shadow: inset 3px 0 0 var(--accent); }

  .block-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .block-type {
    font-size: 9px; text-transform: uppercase; letter-spacing: 0.5px;
    padding: 2px 6px; border-radius: 3px; font-weight: 700;
  }
  .block-type.rule { background: rgba(188,140,255,0.15); color: var(--purple); }
  .block-type.reference { background: rgba(88,166,255,0.15); color: var(--accent); }
  .block-type.skill { background: rgba(63,185,80,0.15); color: var(--green); }
  .block-type.overview { background: rgba(210,153,34,0.15); color: var(--amber); }
  .block-type.instruction { background: rgba(110,118,129,0.2); color: var(--gray); }

  .block-status { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 11px; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; }
  .status-used .status-dot { background: var(--green); }
  .status-used { color: var(--green); }
  .status-unused .status-dot { background: var(--gray); }
  .status-unused { color: var(--gray); }
  .status-overridden .status-dot { background: var(--amber); }
  .status-overridden { color: var(--amber); }
  .status-conflict .status-dot { background: var(--red); }
  .status-conflict { color: var(--red); }

  .block-content {
    font-family: 'SF Mono', Menlo, Consolas, monospace;
    font-size: 12px; color: var(--text);
    white-space: pre-wrap; word-break: break-word;
  }

  .detail-pane {
    width: 380px;
    background: var(--panel);
    border-left: 1px solid var(--border);
    overflow-y: auto;
    padding: 20px;
  }
  .detail-pane.empty {
    display: flex; align-items: center; justify-content: center;
    color: var(--text-dim); font-size: 12px; text-align: center; padding: 40px;
  }

  .detail-section { margin-bottom: 20px; }
  .detail-section h4 {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px;
    color: var(--text-dim); margin-bottom: 8px;
  }

  .trace-step {
    background: var(--panel-2);
    border-left: 3px solid var(--border);
    padding: 8px 10px;
    margin-bottom: 6px;
    border-radius: 0 4px 4px 0;
    font-size: 11px;
  }
  .trace-step.activated { border-left-color: var(--green); }
  .trace-step.overridden { border-left-color: var(--amber); }
  .trace-step.conflict { border-left-color: var(--red); }
  .trace-step .step-label { font-size: 10px; color: var(--text-dim); margin-bottom: 3px; font-family: monospace; }

  .graph-canvas { flex: 1; background: var(--bg); position: relative; overflow: hidden; }
  .graph-canvas svg { width: 100%; height: 100%; display: block; }

  .duplicates-pane {
    width: 360px; background: var(--panel);
    border-left: 1px solid var(--border);
    padding: 20px; overflow-y: auto;
  }

  .dup-card {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    margin-bottom: 10px;
  }
  .dup-card .similarity {
    color: var(--red); font-weight: 700; font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.3px;
  }
  .dup-card .files {
    margin-top: 4px; font-size: 11px; color: var(--text-dim); font-family: monospace;
  }
  .dup-card .snippet {
    margin-top: 6px; padding: 6px 8px;
    background: var(--bg); border-radius: 4px;
    font-family: monospace; font-size: 11px; color: var(--text);
    border-left: 2px solid var(--red);
  }
  .dup-card .note {
    font-size: 11px; margin-top: 8px; color: var(--text-dim);
  }

  .graph-node { cursor: pointer; }
  .graph-node rect {
    fill: var(--panel-2); stroke: var(--border); stroke-width: 1;
    transition: stroke 0.15s;
  }
  .graph-node:hover rect { stroke: var(--accent); }
  .graph-node text { fill: var(--text-bright); font-size: 11px; font-family: monospace; pointer-events: none; }
  .graph-node text.subtitle { fill: var(--text-dim); font-size: 9px; }
  .graph-node.root rect { stroke: var(--accent); stroke-width: 2; }
  .graph-edge { stroke: var(--border); stroke-width: 1.5; fill: none; }
  .graph-edge.duplicate { stroke: var(--red); stroke-dasharray: 5 3; stroke-width: 1.5; }
  .graph-edge-label { font-size: 9px; fill: var(--text-dim); font-family: monospace; }
  .graph-edge-label.dup { fill: var(--red); }

  .legend {
    position: absolute; bottom: 16px; left: 16px;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 6px; padding: 10px 12px; font-size: 11px;
  }
  .legend .row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .legend .row:last-child { margin-bottom: 0; }
  .legend-line { width: 24px; height: 2px; background: var(--border); }
  .legend-line.dup { background: var(--red); height: 0; border-top: 2px dashed var(--red); }

  .info-banner {
    position: absolute; top: 16px; right: 16px;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px 12px; font-size: 11px;
    color: var(--text-dim); max-width: 260px;
  }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--gray); }

  code { font-family: 'SF Mono', Menlo, monospace; font-size: 11px; background: var(--panel-2); padding: 1px 4px; border-radius: 3px; }
</style>
</head>
<body>

<header>
  <h1>Agent Context IDE <span class="badge">prototype</span></h1>
  <nav>
    <button data-view="blocks" class="active">Block Inspector</button>
    <button data-view="graph">Reference Graph</button>
  </nav>
</header>

<main>
  <section id="blocks-view" class="view">
    <aside class="file-tree" id="file-tree"></aside>
    <div class="blocks-pane" id="blocks-pane"></div>
    <aside class="detail-pane empty" id="detail-pane">
      <div>Click a block — or a step in the timeline — to inspect it.</div>
    </aside>
  </section>

  <section id="graph-view" class="view" hidden>
    <div class="graph-canvas" id="graph-canvas">
      <svg id="graph-svg" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="info-banner">Files in your <code>.md</code> agent surface, with explicit <code>@</code> references and detected near-duplicate content.</div>
      <div class="legend">
        <div class="row"><span class="legend-line"></span> explicit reference</div>
        <div class="row"><span class="legend-line dup"></span> duplicate / near-duplicate content</div>
      </div>
    </div>
    <aside class="duplicates-pane" id="duplicates-pane"></aside>
  </section>
</main>

<script>
// ============== MOCK PROJECT ==============
const project = {
  files: [
    {
      path: 'CLAUDE.md',
      blocks: [
        { id: 'claude-1', type: 'overview',    content: 'TypeScript monorepo. Apps in /apps, shared code in /packages.\nAuth flows through @company/auth (the new package).', refs: [] },
        { id: 'claude-2', type: 'rule',        content: 'All TypeScript code must use strict mode with no `any` types.', refs: [] },
        { id: 'claude-3', type: 'rule',        content: 'Always run `pnpm test` before declaring a task complete.', refs: [] },
        { id: 'claude-4', type: 'rule',        content: 'When mocking services in tests, use jest-mock-extended for type-safe mocks.', refs: [] },
        { id: 'claude-5', type: 'reference',   content: 'See @docs/architecture.md for service boundaries.', refs: ['docs/architecture.md'] },
        { id: 'claude-6', type: 'skill',       content: 'Available skills:\n  - @skills/database/SKILL.md\n  - @skills/testing/SKILL.md\n  - @skills/legacy/SKILL.md', refs: ['skills/database/SKILL.md','skills/testing/SKILL.md','skills/legacy/SKILL.md'] },
        { id: 'claude-7', type: 'instruction', content: 'Prefer composition over inheritance. Keep services under 200 lines.', refs: [] },
        { id: 'claude-8', type: 'instruction', content: 'When you finish, post a summary in the team Slack channel #eng-builds.', refs: [] },
      ]
    },
    {
      path: 'skills/testing/SKILL.md',
      blocks: [
        { id: 'test-1', type: 'overview',    content: 'How to write tests in this codebase.', refs: [] },
        { id: 'test-2', type: 'rule',        content: 'Use jest-mock-extended for service mocks. Avoid manual jest.fn() chains.', refs: [] },
        { id: 'test-3', type: 'rule',        content: 'Every public method needs at least one happy-path and one error-path test.', refs: [] },
        { id: 'test-4', type: 'instruction', content: 'Run `pnpm test:watch` while developing.', refs: [] },
      ]
    },
    {
      path: 'skills/legacy/SKILL.md',
      blocks: [
        { id: 'legacy-1', type: 'rule',        content: 'Modules under /legacy/* may use `any` types — do not add stricter typing without coordination.', refs: [] },
        { id: 'legacy-2', type: 'rule',        content: 'Legacy auth flow uses @company/auth-legacy, NOT the new @company/auth package.', refs: [] },
        { id: 'legacy-3', type: 'instruction', content: 'When refactoring legacy code, write a migration plan first in @docs/migrations/.', refs: ['docs/migrations/'] },
      ]
    },
    {
      path: 'skills/database/SKILL.md',
      blocks: [
        { id: 'db-1', type: 'overview',  content: 'Postgres via Prisma. Migrations in /prisma/migrations.', refs: [] },
        { id: 'db-2', type: 'rule',      content: 'Never run `prisma migrate dev` against production.', refs: [] },
        { id: 'db-3', type: 'rule',      content: 'All queries that touch user data must include a `tenantId` filter.', refs: [] },
      ]
    },
  ]
};

// ============== SIMULATED RUN ==============
const agentRun = {
  id: 'run-7f3a2e',
  prompt: 'Refactor UserService in /legacy/users to use the new auth pattern.',
  durationMs: 12400,
  toolCalls: 4,
  steps: [
    { kind: 'load',      ts: 0,    text: 'Loaded CLAUDE.md (8 blocks).',                                       blocks: ['claude-1','claude-2','claude-3','claude-4','claude-5','claude-6','claude-7','claude-8'] },
    { kind: 'load',      ts: 80,   text: 'Activated skills/legacy/SKILL.md — task path matches /legacy/*.',    blocks: ['legacy-1','legacy-2','legacy-3'] },
    { kind: 'load',      ts: 120,  text: 'Activated skills/testing/SKILL.md — task involves tests.',           blocks: ['test-1','test-2','test-3','test-4'] },
    { kind: 'reasoning', ts: 340,  text: 'CLAUDE.md says no `any` types, but legacy/SKILL.md permits `any` for /legacy/*. Following the more specific rule.', activated:['legacy-1'], overridden:[{winner:'legacy-1', loser:'claude-2'}] },
    { kind: 'reasoning', ts: 520,  text: 'CLAUDE.md and testing/SKILL.md both require jest-mock-extended. Using it (the duplicate is harmless here).',       activated:['claude-4','test-2'] },
    { kind: 'tool',      ts: 1100, text: 'Read /legacy/users/UserService.ts (212 lines).',                     activated:[] },
    { kind: 'reasoning', ts: 1400, text: 'Conflict: user prompt says "use new auth pattern" but legacy/SKILL.md says legacy must use @company/auth-legacy.', activated:['legacy-2'], conflict:true },
    { kind: 'reasoning', ts: 1620, text: 'Following the user prompt — migrating to @company/auth — but flagging legacy/SKILL.md note in my final response.', activated:[] },
    { kind: 'tool',      ts: 8200, text: 'Edited /legacy/users/UserService.ts (47-line diff).',                activated:[] },
    { kind: 'tool',      ts: 9100, text: 'Ran `pnpm test legacy/users`. PASS.',                                 activated:['claude-3'] },
    { kind: 'tool',      ts: 12100,text: 'Done.',                                                               activated:[] },
  ]
};

// ============== DERIVE BLOCK STATUS ==============
const blockStatus = {};
project.files.forEach(f => f.blocks.forEach(b => {
  blockStatus[b.id] = { status: 'unused', activations: 0, overriddenBy: null, conflict: false, traces: [] };
}));

agentRun.steps.forEach((step, idx) => {
  (step.activated || []).forEach(bid => {
    if (!blockStatus[bid]) return;
    blockStatus[bid].activations += 1;
    if (blockStatus[bid].status === 'unused') blockStatus[bid].status = 'used';
    blockStatus[bid].traces.push({ idx, step });
  });
  (step.overridden || []).forEach(o => {
    if (blockStatus[o.loser]) {
      blockStatus[o.loser].status = 'overridden';
      blockStatus[o.loser].overriddenBy = o.winner;
      blockStatus[o.loser].traces.push({ idx, step, kind: 'overridden-here' });
    }
  });
  if (step.conflict) {
    (step.activated || []).forEach(bid => {
      if (blockStatus[bid]) {
        blockStatus[bid].status = 'conflict';
        blockStatus[bid].conflict = true;
      }
    });
  }
});

// ============== DUPLICATES ==============
const duplicates = [
  {
    similarity: 0.94,
    blockA: 'claude-4',
    blockB: 'test-2',
    snippet: 'Use jest-mock-extended for service mocks',
    note: 'Same rule stated in CLAUDE.md and skills/testing/SKILL.md. Risk of drift if one is updated but not the other. Suggest: keep canonical version in testing/SKILL.md and replace the CLAUDE.md copy with @ reference.'
  },
  {
    similarity: 0.71,
    blockA: 'claude-3',
    blockB: 'test-4',
    snippet: '`pnpm test` commands',
    note: 'CLAUDE.md says "run `pnpm test` before completing"; testing/SKILL.md says "run `pnpm test:watch` while developing." Adjacent but not identical — consider clarifying which command to use when.'
  },
];

// ============== HELPERS ==============
function blockById(id) {
  for (const f of project.files) {
    const b = f.blocks.find(b => b.id === id);
    if (b) return { block: b, file: f };
  }
  return null;
}
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ============== STATE ==============
let selectedBlock = null;
let selectedStep = null;

// ============== RENDER: FILE TREE ==============
function renderFileTree() {
  const el = document.getElementById('file-tree');
  let html = '<h3>Project</h3>';
  project.files.forEach(f => {
    const used = f.blocks.filter(b => ['used','conflict'].includes(blockStatus[b.id].status)).length;
    const ovr  = f.blocks.filter(b => blockStatus[b.id].status === 'overridden').length;
    const total = f.blocks.length;
    const ovrBadge = ovr > 0 ? ` <span style="color:var(--amber)">·${ovr} ovr</span>` : '';
    html += `<div class="file-item" data-file="${f.path}">
      <span class="icon">📄</span>
      <span>${f.path.split('/').pop()}</span>
      <span class="stats">${used}/${total}${ovrBadge}</span>
    </div>`;
  });
  el.innerHTML = html;
}

// ============== RENDER: BLOCKS PANE ==============
function renderBlocks() {
  const el = document.getElementById('blocks-pane');
  const stepBlocks = selectedStep !== null
    ? new Set([...(agentRun.steps[selectedStep].activated || []), ...(agentRun.steps[selectedStep].blocks || [])])
    : null;

  let html = `
    <div class="pane-header">
      <h2>Context surface for this run</h2>
      <div class="subtitle">Every block that was loaded into the model's context, coloured by how it was used. Click a block for the trace.</div>
    </div>
    <div class="run-bar">
      <div class="label">Simulated run · ${agentRun.id}</div>
      <div class="prompt">"${escapeHtml(agentRun.prompt)}"</div>
      <div class="meta">
        <span>⏱ ${(agentRun.durationMs/1000).toFixed(1)}s</span>
        <span>🔧 ${agentRun.toolCalls} tool calls</span>
        <span>📄 ${project.files.length} context files loaded</span>
        <span>🧱 ${Object.keys(blockStatus).length} blocks · ${Object.values(blockStatus).filter(s=>s.status==='used').length} used · ${Object.values(blockStatus).filter(s=>s.status==='overridden').length} overridden · ${Object.values(blockStatus).filter(s=>s.status==='conflict').length} in conflict · ${Object.values(blockStatus).filter(s=>s.status==='unused').length} never referenced</span>
      </div>
    </div>
    <div class="timeline">
      <div class="label">Run timeline — click a step to see which blocks fired then</div>
      <div class="timeline-track">
  `;
  agentRun.steps.forEach((s, i) => {
    let cls = `step-${s.kind}`;
    if (s.conflict) cls = 'step-conflict';
    else if (s.overridden && s.overridden.length) cls = 'step-overridden';
    const sel = selectedStep === i ? 'selected' : '';
    const initial = { load: 'L', reasoning: 'R', tool: 'T' }[s.kind] || '·';
    html += `<div class="step-dot ${cls} ${sel}" data-step="${i}" title="step ${i+1} · ${s.ts}ms · ${escapeHtml(s.text)}">${initial}</div>`;
  });
  html += `</div></div>`;

  project.files.forEach(f => {
    html += `<div class="folder">${f.path}</div>`;
    f.blocks.forEach(b => {
      const s = blockStatus[b.id];
      const statusClass = `status-${s.status}`;
      const statusLabel = {
        used:       `used ×${s.activations}`,
        unused:     'never referenced',
        overridden: 'overridden',
        conflict:   'conflicts with prompt'
      }[s.status];
      const dimmed = stepBlocks && !stepBlocks.has(b.id) ? 'dimmed' : '';
      const highlighted = stepBlocks && stepBlocks.has(b.id) ? 'highlighted' : '';
      const sel = selectedBlock === b.id ? 'selected' : '';
      html += `
        <div class="block ${sel} ${dimmed} ${highlighted}" data-block="${b.id}">
          <div class="block-header">
            <span class="block-type ${b.type}">${b.type.replace('_',' ')}</span>
            <span class="block-status ${statusClass}">
              <span class="status-dot"></span>${statusLabel}
            </span>
          </div>
          <div class="block-content">${escapeHtml(b.content)}</div>
        </div>
      `;
    });
  });
  el.innerHTML = html;
}

// ============== RENDER: DETAIL PANE ==============
function renderDetail(blockId) {
  const el = document.getElementById('detail-pane');
  if (!blockId) {
    el.classList.add('empty');
    el.innerHTML = '<div>Click a block — or a step in the timeline — to inspect it.</div>';
    return;
  }
  el.classList.remove('empty');
  const ref = blockById(blockId);
  if (!ref) { el.innerHTML = ''; return; }
  const { block, file } = ref;
  const s = blockStatus[blockId];

  let html = `
    <div class="detail-section">
      <h4>Block</h4>
      <div style="font-family:monospace;font-size:11px;color:var(--text-dim);margin-bottom:6px">${file.path}</div>
      <div style="background:var(--panel-2);padding:10px;border-radius:6px;font-family:monospace;font-size:12px;white-space:pre-wrap;border-left:3px solid var(--border)">${escapeHtml(block.content)}</div>
      <div style="margin-top:8px;font-size:11px;color:var(--text-dim)">type: <span class="block-type ${block.type}">${block.type}</span></div>
    </div>

    <div class="detail-section">
      <h4>Status in run ${agentRun.id}</h4>
      <div class="block-status status-${s.status}" style="font-size:13px">
        <span class="status-dot"></span>
        ${{used:`activated ${s.activations} time${s.activations===1?'':'s'}`,unused:'never activated',overridden:'overridden by a more specific rule',conflict:'conflicted with the user prompt'}[s.status]}
      </div>
    </div>
  `;

  if (s.overriddenBy) {
    const winner = blockById(s.overriddenBy);
    html += `
      <div class="detail-section">
        <h4>Overridden by</h4>
        <div class="trace-step overridden">
          <div class="step-label">${winner.file.path}</div>
          <div style="font-family:monospace;font-size:11px">${escapeHtml(winner.block.content)}</div>
        </div>
        <div style="font-size:11px;color:var(--text-dim);margin-top:6px">The agent followed the more path-specific rule. Worth asking: should the override be made explicit in CLAUDE.md, or is silent shadowing acceptable?</div>
      </div>
    `;
  }

  if (s.traces.length) {
    html += `<div class="detail-section"><h4>Agent trace (${s.traces.length})</h4>`;
    s.traces.forEach(t => {
      let cls = 'activated';
      if (t.kind === 'overridden-here') cls = 'overridden';
      else if (t.step.conflict) cls = 'conflict';
      html += `
        <div class="trace-step ${cls}">
          <div class="step-label">step ${t.idx+1} · ${t.step.ts}ms · ${t.step.kind}</div>
          <div>${escapeHtml(t.step.text)}</div>
        </div>
      `;
    });
    html += `</div>`;
  } else {
    html += `<div class="detail-section"><h4>Agent trace</h4>
      <div style="color:var(--text-dim);font-size:12px;font-style:italic;line-height:1.5">This block was loaded into context but never referenced in the agent's reasoning. Possible reasons: (1) genuinely irrelevant to this prompt, (2) phrased in a way that didn't trigger, (3) drowned out by adjacent content. Consider tightening or removing.</div>
    </div>`;
  }

  const dups = duplicates.filter(d => d.blockA === blockId || d.blockB === blockId);
  if (dups.length) {
    html += `<div class="detail-section"><h4>Duplicate content detected</h4>`;
    dups.forEach(d => {
      const other = d.blockA === blockId ? d.blockB : d.blockA;
      const otherInfo = blockById(other);
      html += `
        <div class="dup-card">
          <div class="similarity">${Math.round(d.similarity*100)}% similar</div>
          <div class="files">↔ ${otherInfo.file.path}</div>
          <div class="note">${d.note}</div>
        </div>
      `;
    });
    html += `</div>`;
  }

  el.innerHTML = html;
}

// ============== RENDER: GRAPH ==============
function renderGraph() {
  const svg = document.getElementById('graph-svg');
  const canvas = document.getElementById('graph-canvas');
  const w = canvas.clientWidth;
  const h = canvas.clientHeight;
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);

  const cx = w / 2, cy = h / 2;
  const positions = {
    'CLAUDE.md':                 { x: cx,        y: cy        },
    'skills/testing/SKILL.md':   { x: cx - 280,  y: cy - 130  },
    'skills/legacy/SKILL.md':    { x: cx + 280,  y: cy - 130  },
    'skills/database/SKILL.md':  { x: cx - 280,  y: cy + 130  },
    'docs/architecture.md':      { x: cx + 280,  y: cy + 130  },
    'docs/migrations/':          { x: cx + 460,  y: cy + 30   },
  };

  const edgeSet = new Set();
  const edges = [];
  project.files.forEach(f => {
    f.blocks.forEach(b => {
      (b.refs || []).forEach(r => {
        const k = `${f.path}->${r}`;
        if (edgeSet.has(k)) return;
        edgeSet.add(k);
        edges.push({ from: f.path, to: r, type: 'reference' });
      });
    });
  });
  duplicates.forEach(d => {
    if (d.similarity < 0.8) return;
    const a = blockById(d.blockA), b = blockById(d.blockB);
    if (!a || !b || a.file.path === b.file.path) return;
    const k = `${a.file.path}<->${b.file.path}`;
    if (edgeSet.has(k)) return;
    edgeSet.add(k);
    edges.push({ from: a.file.path, to: b.file.path, type: 'duplicate', label: `${Math.round(d.similarity*100)}% dup` });
  });

  let svgHtml = '';
  edges.forEach(e => {
    const from = positions[e.from], to = positions[e.to];
    if (!from || !to) return;
    const cls = e.type === 'duplicate' ? 'graph-edge duplicate' : 'graph-edge';
    const dx = to.x - from.x, dy = to.y - from.y;
    const mx = (from.x + to.x) / 2 - dy * 0.12;
    const my = (from.y + to.y) / 2 + dx * 0.12;
    svgHtml += `<path class="${cls}" d="M ${from.x} ${from.y} Q ${mx} ${my} ${to.x} ${to.y}" />`;
    if (e.label) {
      const labelCls = e.type === 'duplicate' ? 'graph-edge-label dup' : 'graph-edge-label';
      svgHtml += `<text class="${labelCls}" x="${mx}" y="${my - 4}" text-anchor="middle">${e.label}</text>`;
    }
  });

  Object.entries(positions).forEach(([path, p]) => {
    const isRoot = path === 'CLAUDE.md';
    const file = project.files.find(f => f.path === path);
    const label = path.split('/').pop() || path;
    const subtitle = file ? `${file.blocks.length} blocks` : 'external';
    svgHtml += `
      <g class="graph-node ${isRoot ? 'root' : ''}" transform="translate(${p.x},${p.y})" data-file="${path}">
        <rect x="-95" y="-26" width="190" height="52" rx="6"/>
        <text x="0" y="-3" text-anchor="middle">${label}</text>
        <text class="subtitle" x="0" y="14" text-anchor="middle">${subtitle}</text>
      </g>
    `;
  });
  svg.innerHTML = svgHtml;

  const pane = document.getElementById('duplicates-pane');
  let html = '<div class="pane-header"><h2>Duplicates &amp; near-duplicates</h2><div class="subtitle">Content that appears in more than one agent file.</div></div>';
  duplicates.forEach(d => {
    const a = blockById(d.blockA), b = blockById(d.blockB);
    html += `
      <div class="dup-card">
        <div class="similarity">${Math.round(d.similarity*100)}% similar</div>
        <div class="files">${a.file.path}<br>${b.file.path}</div>
        <div class="snippet">${escapeHtml(d.snippet)}</div>
        <div class="note">${d.note}</div>
      </div>
    `;
  });
  pane.innerHTML = html;
}

// ============== EVENTS ==============
document.querySelectorAll('nav button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const view = btn.dataset.view;
    document.getElementById('blocks-view').hidden = view !== 'blocks';
    document.getElementById('graph-view').hidden  = view !== 'graph';
    if (view === 'graph') setTimeout(renderGraph, 0);
  });
});

document.getElementById('blocks-pane').addEventListener('click', e => {
  const stepDot = e.target.closest('.step-dot');
  if (stepDot) {
    const i = parseInt(stepDot.dataset.step, 10);
    selectedStep = (selectedStep === i) ? null : i;
    selectedBlock = null;
    renderBlocks();
    renderDetail(null);
    return;
  }
  const blockEl = e.target.closest('.block');
  if (blockEl) {
    selectedBlock = blockEl.dataset.block;
    selectedStep = null;
    renderBlocks();
    renderDetail(selectedBlock);
  }
});

window.addEventListener('resize', () => {
  if (!document.getElementById('graph-view').hidden) renderGraph();
});

// init
renderFileTree();
renderBlocks();
renderDetail(null);
</script>

</body>
</html>
